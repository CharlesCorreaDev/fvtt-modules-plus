name: Release & Publish SWADE AutoGame Plus to Foundry VTT

on:
  push:
    tags:
      - 'swade-autogame-v*'

jobs:
  build-and-release:
    name: Build & Release SWADE AutoGame Plus
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Version from Tag
        id: get_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          CLEAN_VERSION=$(echo "$RAW_TAG" | sed -E 's/.*v//')
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Module into Zip
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const archiver = require("archiver");

            const sourceDir = "foundry-v14/modules/swade-autogame-plus";
            const targetZip = "swade-autogame-plus.zip";
            const pkgId = "swade-autogame-plus";

            const output = fs.createWriteStream(targetZip);
            const archive = archiver("zip", { zlib: { level: 9 } });

            output.on("close", () => {
              console.log(`Pacote criado com sucesso: ${archive.pointer()} total bytes`);
            });

            archive.pipe(output);

            const addFolder = (dir, baseInZip) => {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory()) {
                  addFolder(fullPath, path.join(baseInZip, file));
                } else {
                  archive.file(fullPath, { name: path.join(baseInZip, file) });
                }
              }
            };

            addFolder(sourceDir, pkgId);
            archive.finalize();
          '

      - name: Extract Changelog for Current Version
        id: extract_changelog
        run: |
          node -e '
            const fs = require("fs");
            const file = "foundry-v14/modules/swade-autogame-plus/CHANGELOG.md";
            const version = "${{ steps.get_version.outputs.version }}";
            let notes = "";
            if (fs.existsSync(file)) {
              const content = fs.readFileSync(file, "utf8");
              const lines = content.split("\n");
              let capturing = false;
              const collected = [];
              for (const line of lines) {
                if (line.startsWith(`## [${version}]`)) {
                  capturing = true;
                  collected.push(line);
                } else if (capturing && line.startsWith("## [")) {
                  break;
                } else if (capturing) {
                  collected.push(line);
                }
              }
              if (collected.length > 0) notes = collected.join("\n").trim();
            }
            if (!notes) {
              notes = `## ⚔️ SWADE AutoGame Plus v${version}\n\nVeja as alterações no [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/${file}).`;
            }
            fs.writeFileSync("release_notes.md", notes);
          '

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: "SWADE AutoGame Plus v${{ steps.get_version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: |
            swade-autogame-plus.zip
            foundry-v14/modules/swade-autogame-plus/module.json
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Foundry VTT Package Release API
        if: ${{ secrets.FOUNDRY_RELEASE_TOKEN_SWADE_AUTOGAME != '' }}
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN_SWADE_AUTOGAME }}
        run: |
          echo "Notificando Foundry VTT Package Release API..."
          RESPONSE=$(curl -w "\nHTTP_STATUS:%{http_code}" -s -S -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.FOUNDRY_RELEASE_TOKEN_SWADE_AUTOGAME }}" \
            -d '{
              "id": "swade-autogame-plus",
              "dry-run": false,
              "release": {
                "version": "${{ steps.get_version.outputs.version }}",
                "manifest": "https://raw.githubusercontent.com/${{ github.repository }}/main/foundry-v14/modules/swade-autogame-plus/module.json",
                "notes": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
                "compatibility": {
                  "minimum": "12",
                  "verified": "14"
                }
              }
            }')
          echo "Resposta da API do Foundry VTT:"
          echo "$RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Falha ao publicar versão na API do Foundry VTT (HTTP $HTTP_STATUS)"
            exit 1
          fi

